# Public entry point (HTTP). For production TLS see `tls.conf.example` in this
# directory and DEPLOYMENT.md.

upstream web_upstream {
    server web:3000;
    keepalive 32;
}

upstream api_upstream {
    server api:4000;
    keepalive 32;
}

# Shared proxy settings
map $host $forwarded_proto {
    default $scheme;
}

server {
    listen 80;
    server_name _;

    # Security headers (also applied to proxied responses).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- API --------------------------------------------------------------
    location /api/ {
        limit_req zone=api_general burst=40 nodelay;
        proxy_pass http://api_upstream;
        include /etc/nginx/proxy-params.conf;
    }

    # Stricter limits for authentication endpoints.
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://api_upstream;
        include /etc/nginx/proxy-params.conf;
    }

    location = /health {
        proxy_pass http://api_upstream;
        include /etc/nginx/proxy-params.conf;
        access_log off;
    }

    location = /health/ready {
        proxy_pass http://api_upstream;
        include /etc/nginx/proxy-params.conf;
        access_log off;
    }

    # --- Static assets from Next.js (immutable, long cache) ---------------
    location /_next/static/ {
        proxy_pass http://web_upstream;
        include /etc/nginx/proxy-params.conf;
        proxy_cache_valid 200 30d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # --- Everything else → Next.js ----------------------------------------
    location / {
        proxy_pass http://web_upstream;
        include /etc/nginx/proxy-params.conf;
    }
}
