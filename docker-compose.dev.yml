# Local development infrastructure only (run the apps with pnpm):
#   docker compose -f docker-compose.dev.yml up -d
#   pnpm dev:api   # http://localhost:4000
#   pnpm dev:web   # http://localhost:3000

name: persian-ecommerce-dev

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpass}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-persian_ecommerce}
      MARIADB_USER: ${MARIADB_USER:-app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-apppass}
    ports:
      - '${MARIADB_PORT:-3306}:3306'
    volumes:
      - mariadb-dev-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mariadb-dev-data:
