# Persian E-Commerce — production-oriented Docker Compose stack
#
#   cp .env.example .env   # then edit secrets
#   docker compose build
#   docker compose up -d
#
# Only nginx publishes ports. MariaDB, the API and the web app stay on the
# internal network.

name: persian-ecommerce

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=256M
      - --max-connections=200
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?set MARIADB_ROOT_PASSWORD in .env}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-persian_ecommerce}
      MARIADB_USER: ${MARIADB_USER:-app}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?set MARIADB_PASSWORD in .env}
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: persian-ecommerce/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      # Keep `production` for real deployments. `development` only exists so a
      # local Compose stack can run end-to-end with the mock payment gateway.
      NODE_ENV: ${API_NODE_ENV:-production}
      API_PORT: 4000
      API_GLOBAL_PREFIX: api/v1
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-log}
      TRUST_PROXY: 'true'
      DATABASE_URL: mysql://${MARIADB_USER:-app}:${MARIADB_PASSWORD}@mariadb:3306/${MARIADB_DATABASE:-persian_ecommerce}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ORDER_PAYMENT_TIMEOUT_MINUTES: ${ORDER_PAYMENT_TIMEOUT_MINUTES:-30}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-${APP_URL:-http://localhost:8080}/api/v1}
      PAYMENT_ENCRYPTION_KEY: ${PAYMENT_ENCRYPTION_KEY:?set PAYMENT_ENCRYPTION_KEY in .env}
      PAYMENT_MOCK_ENABLED: ${PAYMENT_MOCK_ENABLED:-false}
      PAYMENT_MOCK_DEFAULT: ${PAYMENT_MOCK_DEFAULT:-false}
      MARKETPLACE_DEFAULT_COMMISSION_BPS: ${MARKETPLACE_DEFAULT_COMMISSION_BPS:-1000}
      RUN_MIGRATIONS_ON_START: ${RUN_MIGRATIONS_ON_START:-true}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    volumes:
      - api-uploads:/app/apps/api/uploads
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - backend
      - frontend

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
        API_INTERNAL_URL: http://api:4000/api/v1
    image: persian-ecommerce/web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:8080}
      API_INTERNAL_URL: http://api:4000/api/v1
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontend

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
      - '${NGINX_HTTPS_PORT:-443}:443'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/proxy-params.conf:/etc/nginx/proxy-params.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - frontend

volumes:
  mariadb-data:
  api-uploads:

networks:
  frontend:
  backend:
